<!doctype html>
<html data-i18n-page-title="adminConfig.devices.title">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Security and paired devices</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/admin-config.css?v=20261009b" />
</head>
<body>
  <main class="config-page">
    <header class="config-hero">
      <div>
        <p class="eyebrow" data-i18n="adminConfig.devices.key">Sécurité</p>
        <h1 data-i18n="adminConfig.devices.title">Appareils associés</h1>
        <p class="hero-copy" data-i18n="adminConfig.devices.description">Consultez les appareils autorisés, révoquez une association ou associez un nouvel appareil avec le QR code.</p>
      </div>
      <div class="hero-actions">
        <a class="secondary-link" href="/" data-i18n="adminConfig.back">Retour remote</a>
        <a class="secondary-link" href="/qr" data-i18n="adminConfig.devices.reassociate">Associer un appareil</a>
      </div>
    </header>

    <section class="config-section device-sessions-section" aria-labelledby="device-sessions-title">
      <h2 id="device-sessions-title" data-i18n="adminConfig.devices.title">Appareils associés</h2>
      <div class="device-sessions-actions">
        <button id="revoke-all-device-sessions" type="button" disabled data-i18n="adminConfig.devices.revokeAll">Tout révoquer</button>
        <button id="reload-device-sessions" type="button" data-i18n="adminConfig.devices.reload">Actualiser</button>
      </div>
      <p id="device-sessions-status" class="device-sessions-status" role="status" aria-live="polite"></p>
      <ul id="device-sessions-list" class="device-sessions-list" aria-labelledby="device-sessions-title"></ul>
    </section>
  </main>

  <script type="module" src="/client/ui/security/page.js?v=20261009b"></script>
</body>
</html>
