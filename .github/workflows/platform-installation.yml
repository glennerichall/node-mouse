name: Platform installation smoke tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes build-essential libpng-dev libx11-dev libxtst-dev
      - run: npm ci
      - run: npm test

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - name: Install native build dependencies and virtual display
        run: sudo apt-get update && sudo apt-get install --yes build-essential libpng-dev libx11-dev libxtst-dev xvfb
      - run: npm ci
      - name: Install Chromium and browser dependencies
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E under X11
        run: >-
          xvfb-run --auto-servernum --server-args='-screen 0 1280x720x24'
          bash -c 'PLAYWRIGHT_PORT=3210 PLAYWRIGHT_REPORT_DIR=playwright-report/chromium
          PLAYWRIGHT_OUTPUT_DIR=test-results/chromium npx playwright test --project=chromium
          && PLAYWRIGHT_PORT=3220 PLAYWRIGHT_REPORT_DIR=playwright-report/mobile-chrome
          PLAYWRIGHT_OUTPUT_DIR=test-results/mobile-chrome npx playwright test --project=mobile-chrome'
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  linux-install:
    name: Linux package installation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm run test:install:integration

  linux-x11:
    name: Linux X11 installation and startup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - name: Install X11 runtime and build dependencies
        run: sudo apt-get update && sudo apt-get install --yes build-essential libpng-dev libx11-dev libxtst-dev xvfb x11-utils xdotool
      - run: npm ci
      - name: Install the packed npm artifact
        shell: bash
        run: |
          tarball=$(npm pack --pack-destination "$RUNNER_TEMP" --silent)
          npm install --global "$RUNNER_TEMP/$tarball"
      - name: Start and probe the installed server
        run: xvfb-run --auto-servernum --server-args='-screen 0 1280x720x24' node test/integration/host-install/run-host-smoke.mjs

  linux-wayland:
    name: Linux Wayland installation and startup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - name: Install Wayland runtime and build dependencies
        run: sudo apt-get update && sudo apt-get install --yes build-essential dbus-x11 libpng-dev libx11-dev libxtst-dev weston xwayland
      - run: npm ci
      - name: Install the packed npm artifact
        shell: bash
        run: |
          tarball=$(npm pack --pack-destination "$RUNNER_TEMP" --silent)
          npm install --global "$RUNNER_TEMP/$tarball"
      - name: Start a headless Wayland compositor and probe the installation
        shell: bash
        run: |
          runtime_dir=$(mktemp -d)
          chmod 700 "$runtime_dir"
          export XDG_RUNTIME_DIR="$runtime_dir"
          dbus-run-session -- bash -euo pipefail -c '
            weston --backend=headless-backend.so --socket=wayland-1 --xwayland --idle-time=0 >/tmp/remote-mouse-weston.log 2>&1 &
            compositor=$!
            trap "kill $compositor 2>/dev/null || true" EXIT
            for attempt in {1..30}; do
              test -S "$XDG_RUNTIME_DIR/wayland-1" && break
              sleep 1
            done
            test -S "$XDG_RUNTIME_DIR/wayland-1"
            export WAYLAND_DISPLAY=wayland-1
            node test/integration/host-install/run-host-smoke.mjs
          '

  gnome-extension:
    name: GNOME Shell extension
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GNOME extension runtime
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends gjs gnome-shell
      - name: Pack the GNOME extension
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gnome-extension"
          gnome-extensions pack --force --out-dir "$RUNNER_TEMP/gnome-extension" \
            native/gnome-shell/remote-mouse-focus@velor
          test -f "$RUNNER_TEMP/gnome-extension/remote-mouse-focus@velor.shell-extension.zip"
      - name: Run the extension with GJS
        run: gjs --module test/integration/gnome-focus-extension.mjs

  windows:
    name: Windows installation and startup
    # Pin the runner while node-gyp catches up with the newer VS toolset used
    # by windows-latest; better-sqlite3 needs the C++ build environment here.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm run test:install
      - name: Install the packed npm artifact
        shell: pwsh
        run: |
          $tarball = npm pack --pack-destination $env:RUNNER_TEMP --silent | Select-Object -Last 1
          "REMOTE_MOUSE_UPDATE_TARBALL=$(Join-Path $env:RUNNER_TEMP $tarball.Trim())" >> $env:GITHUB_ENV
          npm install --global (Join-Path $env:RUNNER_TEMP $tarball.Trim())
      - name: Start and probe the installed server
        run: node test/integration/host-install/run-host-smoke.mjs
